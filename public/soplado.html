<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Soplado - Belcen</title>
    <style>
        :root {
            --bg: #f2f2f7;
            --card: rgba(255, 255, 255, 0.72);
            --card-bord: rgba(0, 0, 0, 0.07);
            --texto: #1c1c1e;
            --texto2: #6c7280;
            --azul: #0a84ff;
            --verde: #34c759;
            --teal: #17a2b8;
            --rojo: #ff3b30;
            --sombra: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            background-color: var(--bg);
            color: var(--texto);
            padding: 24px 16px 56px;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            max-width: 700px; margin: auto;
            background: var(--card);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid var(--card-bord);
            border-radius: 20px;
            box-shadow: var(--sombra);
            padding: 25px;
            border-top: 5px solid var(--teal);
        }
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .card { background: rgba(255, 255, 255, 0.94); }
        }

        h3 {
            color: #0a6ea8;
            text-align: center;
            border-bottom: 2px solid rgba(23, 162, 184, 0.35);
            padding: 0 0 12px;
            margin: 0 0 16px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        select, input {
            padding: 12px 14px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            font-size: 14px;
            box-sizing: border-box;
            width: 100%;
            margin-top: 6px;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.7);
            color: var(--texto);
            font-family: inherit;
        }
        select:focus, input:focus {
            outline: none;
            border-color: var(--azul);
            box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.15);
        }
        select { -webkit-appearance: none; appearance: none; background-image: linear-gradient(45deg, transparent 50%, #6c7280 50%), linear-gradient(135deg, #6c7280 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%; background-size: 5px 5px; background-repeat: no-repeat; background-origin: inherit; }

        .logout { display: inline-block; margin-bottom: 12px; color: var(--azul); text-decoration: none; font-weight: 600; }
        .logout:hover { text-decoration: underline; }

        .btn-accion {
            background: var(--verde);
            color: white;
            border: none;
            padding: 14px 20px;
            font-weight: 700;
            border-radius: 999px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-family: inherit;
            box-shadow: 0 6px 16px rgba(52, 199, 89, 0.30);
            margin-top: 4px;
        }
        .btn-accion:hover { filter: brightness(0.96); }
        .btn-accion:active { transform: scale(0.98); }
        .btn-accion:disabled { opacity: 0.6; }

        .info-receta {
            background: rgba(23, 162, 184, 0.08);
            padding: 13px 15px;
            border-radius: 14px;
            font-size: 13px;
            color: #0a6ea8;
            margin-bottom: 16px;
            border-left: 4px solid var(--teal);
            line-height: 1.5;
        }

        .estado-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; }
        .estado-info { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .estado-pill {
            padding: 8px 18px; border-radius: 999px; font-weight: 800; font-size: 14px; color: #fff;
            display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
        }
        .estado-pill.marcha { background: var(--verde); box-shadow: 0 4px 12px rgba(52, 199, 89, 0.35); }
        .estado-pill.parado { background: var(--rojo); box-shadow: 0 4px 12px rgba(255, 59, 48, 0.30); }
        .estado-totales { font-size: 13px; color: var(--texto2); font-weight: 600; }
        .btn-estado {
            background: var(--azul); color: #fff; border: none; padding: 12px 22px; border-radius: 999px;
            cursor: pointer; font-weight: 800; font-size: 14px; font-family: inherit;
            box-shadow: 0 6px 16px rgba(10, 132, 255, 0.30);
        }
        .btn-estado:hover { filter: brightness(0.95); }
        .btn-estado:active { transform: scale(0.97); }
        .btn-estado:disabled { opacity: 0.6; }

        .btn-logout-custom {
            background: var(--rojo);
            color: white;
            border: none;
            padding: 12px 22px;
            font-weight: 700;
            border-radius: 999px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            box-shadow: 0 6px 16px rgba(255, 59, 48, 0.25);
        }
        .btn-logout-custom:hover { filter: brightness(0.95); }
        .btn-logout-custom:active { transform: scale(0.97); }

        .pie-foot {
            text-align: center;
            margin-top: 26px;
            padding-top: 16px;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
        }

        @media (max-width: 640px) {
            body { padding: 12px 10px calc(16px + env(safe-area-inset-bottom)); }
            .card { padding: 18px; }
            h3 { font-size: 18px; }
            select, input { font-size: 16px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <div class="card estado-bar">
        <div class="estado-info">
            <span id="pillEstadoSoplado" class="estado-pill parado">🔴 PARADO</span>
            <span id="totalesEstadoSoplado" class="estado-totales">Hoy: — botellas</span>
        </div>
        <button id="btnCambiarEstadoSoplado" class="btn-estado" onclick="cambiarEstadoSoplado()">🟢 MARCAR EN MARCHA</button>
    </div>

    <div class="card">
        <h3>REPORTE DE TURNO - SOPLADO</h3>
        
        <div class="info-receta">
            ℹ️ Seleccione la preforma específica utilizada, el tipo de botella a producir y la cantidad. La etiqueta y el stock de botellas se actualizarán automáticamente.
        </div>

        <form id="formSoplado">
            <div>
                <label><b>Seleccionar Preforma Utilizada:</b></label>
                <select id="preforma_nombre" name="preforma_nombre" required>
                    <option value="">-- Seleccione la preforma exacta --</option>
                    <option value="SERVICIO SAUÑE (1LT-900ML)">SERVICIO SAUÑE (1LT-900ML)</option>
                    <option value="SERVICIO SAUÑE PREFORMA 09 GR (200ML)">SERVICIO SAUÑE PREFORMA 09 GR (200ML)</option>
                    <option value="Preforma cristal 23.5 gr (PICO 26MM)">Preforma cristal 23.5 gr (PICO 26MM)</option>
                    <option value="SERVICIO SOPLADO 500 ML PREF-15.5GR (SAUÑE)">SERVICIO SOPLADO 500 ML PREF-15.5GR (SAUÑE)</option>
                    <option value="Preforma cristal de 104 gr pico 45mm (3LT)">Preforma cristal de 104 gr pico 45mm (3LT)</option>
                </select>
            </div>

            <div>
                <label><b>Seleccionar Botella a Producir:</b></label>
                <select id="botella_tipo" name="botella_tipo" required>
                    <option value="">-- Seleccione tipo de botella --</option>
                    <optgroup label="Línea Belini">
                        <option value="soplado_belini_200ml">Botella Belini x 200 ml</option>
                        <option value="soplado_belini_500ml">Botella Belini x 500 ml</option>
                        <option value="soplado_belini_900ml">Botella Belini x 900 ml</option>
                        <option value="soplado_belini_1lt">Botella Belini x 1 Lt</option>
                        <option value="soplado_belini_3lt">Botella Belini x 3 Lt</option>
                    </optgroup>
                    <optgroup label="Línea B-1">
                        <option value="soplado_b1_200ml">Botella de 200 ml - B-1</option>
                        <option value="soplado_b1_500ml">Botella de 500 ml - B-1</option>
                        <option value="soplado_b1_900ml">Botella de 900 ml - B-1</option>
                        <option value="soplado_b1_1lt">Botella de 1 Lt - B-1</option>
                        <option value="soplado_b1_2lt">Botella de 2 Lt - B-1</option>
                    </optgroup>
                    <optgroup label="Otras Marcas">
                        <option value="soplado_donlalo_800ml">Botella de 800ml - Don Lalo</option>
                        <option value="soplado_vega_900ml">Botella VEGA x 900 ml</option>
                    </optgroup>
                </select>
            </div>

            <div>
                <label><b>Cantidad de Botellas Fabricadas:</b></label>
                <input type="number" id="cantidad_producida" name="cantidad_producida" min="1" placeholder="Ej. 3000" required>
            </div>

            <div>
                <button type="submit" class="btn-accion">🚀 Registrar Producción y Actualizar Insumos</button>
            </div>
        </form>

        <div class="pie-foot">
            <a href="dashboard.html" class="logout" id="linkDashboard">Volver al Dashboard General</a>
            <br>
            <button onclick="cerrarSesion()" class="btn-logout-custom">🔒 Cerrar Sesión (Salir)</button>
        </div>
    </div>

    <script src="/auth-client.js"></script>
    <script>
        const rolUsuario = localStorage.getItem('rol_actual');
        if (!rolUsuario || (rolUsuario !== 'soplado' && rolUsuario !== 'supervisor' && rolUsuario !== 'produccion')) {
            alert('❌ Acceso no autorizado.');
            window.location.href = 'index.html';
        }
        if (rolUsuario !== 'supervisor' && rolUsuario !== 'produccion') {
            document.getElementById('linkDashboard').style.display = 'none';
        }

        function cerrarSesion() {
            if (confirm('¿Estás seguro de que deseas cerrar sesión?')) {
                limpiarSesion();
                window.location.href = 'index.html';
            }
        }

        let enviandoSoplado = false;
        document.getElementById('formSoplado').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (enviandoSoplado) return;
            enviandoSoplado = true;
            const btnEnviar = e.submitter || document.querySelector('#formSoplado button[type="submit"]');
            if (btnEnviar) btnEnviar.disabled = true;
            const preforma_nombre = document.getElementById('preforma_nombre').value;
            const botella_tipo = document.getElementById('botella_tipo').value;
            const cantidad_producida = parseInt(document.getElementById('cantidad_producida').value);

            if (!preforma_nombre || !botella_tipo || isNaN(cantidad_producida) || cantidad_producida <= 0) {
                alert('❌ Seleccione la preforma, el tipo de botella y una cantidad válida.');
                enviandoSoplado = false;
                if (btnEnviar) btnEnviar.disabled = false;
                return;
            }

            try {
                const res = await fetch('/api/soplado/registrar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        preforma_nombre,
                        botella_tipo,
                        cantidad_producida,
                        usuario: localStorage.getItem('usuario_actual') || 'soplado_user'
                    })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    alert('✅ ' + data.mensaje);
                    document.getElementById('formSoplado').reset();
                } else {
                    alert('❌ ' + (data.mensaje || 'Error al registrar producción.'));
                }
            } catch (err) {
                console.error(err);
                alert('Error de conexión con el servidor.');
            } finally {
                enviandoSoplado = false;
                if (btnEnviar) btnEnviar.disabled = false;
            }
        });

        let estadoSopladoActual = 'PARADO';

        function pintarEstadoSoplado() {
            const pill = document.getElementById('pillEstadoSoplado');
            const btn = document.getElementById('btnCambiarEstadoSoplado');
            if (estadoSopladoActual === 'EN MARCHA') {
                pill.className = 'estado-pill marcha';
                pill.textContent = '🟢 EN MARCHA';
                btn.textContent = '🛑 MARCAR PARADO';
            } else {
                pill.className = 'estado-pill parado';
                pill.textContent = '🔴 PARADO';
                btn.textContent = '🟢 MARCAR EN MARCHA';
            }
        }

        function fechaCorta(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d.getTime())) return String(iso).substring(0, 10);
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        function fechaHoyLocal() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        async function cargarTotalesSoplado() {
            try {
                const res = await fetch('/api/soplado/reportes');
                if (!res.ok) throw new Error('Error del servidor.');
                const datos = await res.json();
                const reportes = Array.isArray(datos) ? datos : [];
                const hoy = fechaHoyLocal();
                let totalBotellas = 0;
                reportes.forEach(r => {
                    if (fechaCorta(r.fecha_reporte) === hoy) {
                        totalBotellas += parseInt(r.cantidad_botellas || 0, 10);
                    }
                });
                document.getElementById('totalesEstadoSoplado').textContent = 'Hoy: ' + totalBotellas + ' botellas';
            } catch (e) {
                console.error(e);
            }
        }

        async function cargarEstadoSoplado() {
            try {
                const res = await fetch('/api/estado-lineas');
                if (!res.ok) throw new Error('Error del servidor.');
                const estados = await res.json();
                const fila = (Array.isArray(estados) ? estados : []).find(e => e.area === 'soplado');
                estadoSopladoActual = fila && fila.estado ? fila.estado : 'PARADO';
                pintarEstadoSoplado();
            } catch (e) {
                console.error(e);
            }
        }

        let cambiandoEstadoSoplado = false;
        async function cambiarEstadoSoplado() {
            if (cambiandoEstadoSoplado) return;
            cambiandoEstadoSoplado = true;
            const btn = document.getElementById('btnCambiarEstadoSoplado');
            if (btn) btn.disabled = true;
            const nuevo = estadoSopladoActual === 'EN MARCHA' ? 'PARADO' : 'EN MARCHA';
            try {
                const res = await fetch('/api/estado-linea', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        area: 'soplado',
                        estado: nuevo,
                        usuario: localStorage.getItem('usuario_actual') || 'soplado_user'
                    })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    estadoSopladoActual = data.estado;
                    pintarEstadoSoplado();
                } else {
                    alert('❌ ' + (data.mensaje || 'Error al cambiar el estado.'));
                }
            } catch (err) {
                console.error(err);
                alert('Error de conexión con el servidor.');
            } finally {
                cambiandoEstadoSoplado = false;
                if (btn) btn.disabled = false;
            }
        }

        cargarEstadoSoplado();
        cargarTotalesSoplado();
        registrarAutoRefresco(() => { cargarEstadoSoplado(); cargarTotalesSoplado(); }, 15000);
    </script>
</body>
</html>
