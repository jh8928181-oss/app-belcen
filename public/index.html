<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso ERP - Corporación Belcen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 20% 20%, #1b2a6b 0%, #0f1740 45%, #05081f 100%);
            color: #fff;
            position: relative;
            overflow: hidden;
            padding: 16px;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.55;
            z-index: 0;
            animation: float 14s ease-in-out infinite alternate;
        }
        .blob-1 {
            width: 420px; height: 420px;
            left: -90px; top: -110px;
            background: radial-gradient(circle, rgba(103, 58, 183, 0.9), rgba(103, 58, 183, 0) 70%);
        }
        .blob-2 {
            width: 500px; height: 500px;
            right: -120px; bottom: -140px;
            background: radial-gradient(circle, rgba(0, 188, 212, 0.8), rgba(0, 188, 212, 0) 70%);
            animation-delay: 3s;
        }
        .blob-3 {
            width: 340px; height: 340px;
            top: 30%; left: 55%;
            background: radial-gradient(circle, rgba(63, 81, 181, 0.85), rgba(63, 81, 181, 0) 70%);
            animation-delay: 6s;
        }

        @keyframes float {
            0%   { transform: translateY(0) translateX(0) scale(1); }
            50%  { transform: translateY(40px) translateX(30px) scale(1.12); }
            100% { transform: translateY(-30px) translateX(-20px) scale(0.95); }
        }

        .polvo {
            position: absolute;
            inset: 0;
            z-index: 1;
            background-image:
                radial-gradient(rgba(255,255,255,0.14) 1px, transparent 1px);
            background-size: 34px 34px;
            opacity: 0.5;
            pointer-events: none;
        }

        .login-wrap {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 430px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 22px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.38);
            padding: 38px 34px 32px;
        }

        .brand {
            text-align: center;
            margin-bottom: 26px;
        }
        .brand-logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 12px;
            border-radius: 18px;
            background: linear-gradient(135deg, #2196f3, #9c27b0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 26px;
            color: #fff;
            box-shadow: 0 8px 22px rgba(33, 150, 243, 0.4);
        }
        .brand h2 {
            font-size: 21px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .brand p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 4px;
            font-weight: 300;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 7px;
            letter-spacing: 0.2px;
        }

        .input-wrap {
            position: relative;
        }
        .input-wrap .icono {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.55);
            font-size: 16px;
            pointer-events: none;
        }

        input {
            width: 100%;
            padding: 13px 14px 13px 44px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none;
        }
        input::placeholder { color: rgba(255, 255, 255, 0.45); }
        input:focus {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(0, 188, 212, 0.9);
            box-shadow: 0 0 0 3px rgba(0, 188, 212, 0.22);
        }

        .opciones {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 6px 2px 18px;
        }
        .recordar {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            user-select: none;
        }
        .recordar input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }
        .check-caja {
            width: 19px;
            height: 19px;
            flex: 0 0 19px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .check-caja::after {
            content: '';
            width: 6px;
            height: 10px;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg) scale(0);
            transition: transform 0.15s;
            margin-top: -2px;
        }
        .recordar input:checked + .check-caja {
            background: linear-gradient(135deg, #2196f3, #9c27b0);
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.4);
        }
        .recordar input:checked + .check-caja::after { transform: rotate(45deg) scale(1); }

        .btn-ingresar {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #00bcd4, #3f51b5);
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.4px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
            box-shadow: 0 8px 22px rgba(0, 188, 212, 0.35);
        }
        .btn-ingresar:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(0, 188, 212, 0.45);
            filter: brightness(1.08);
        }
        .btn-ingresar:active:not(:disabled) { transform: translateY(0); }
        .btn-ingresar:disabled { opacity: 0.65; cursor: not-allowed; }

        .error-msg {
            color: #ff80ab;
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            font-weight: 500;
            min-height: 18px;
        }

        .footer-login {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.45);
            font-weight: 300;
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .glass-card { padding: 28px 22px 24px; border-radius: 18px; }
            .brand h2 { font-size: 18px; }
            .blob-1 { width: 260px; height: 260px; }
            .blob-2 { width: 300px; height: 300px; }
            .blob-3 { width: 220px; height: 220px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .blob { animation: none; }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="polvo"></div>

    <div class="login-wrap">
        <div class="glass-card">
            <div class="brand">
                <div class="brand-logo">B</div>
                <h2>Corporación Belcen S.A.C.</h2>
                <p>Acceso al Sistema ERP</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <div class="input-wrap">
                        <span class="icono">👤</span>
                        <input type="text" id="usuario" placeholder="Ingrese su usuario" autocomplete="username" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrap">
                        <span class="icono">🔒</span>
                        <input type="password" id="password" placeholder="Ingrese su contraseña" autocomplete="current-password" required>
                    </div>
                </div>

                <div class="opciones">
                    <label class="recordar">
                        <input type="checkbox" id="recordar">
                        <span class="check-caja"></span>
                        Recordar contraseña
                    </label>
                </div>

                <button type="submit" id="btnIngresar" class="btn-ingresar">Ingresar al Sistema</button>
            </form>
            <div id="errorMsg" class="error-msg"></div>
            <div class="footer-login">Corporación Belcen S.A.C. · ERP Interno</div>
        </div>
    </div>

    <script>
        (function () {
            try {
                localStorage.removeItem('token_actual');
                localStorage.removeItem('usuario_actual');
                localStorage.removeItem('rol_actual');
                localStorage.removeItem('rol_usuario');
            } catch (e) { }
        })();

        (function () {
            try {
                const recordado = localStorage.getItem('login_recordado');
                if (recordado) {
                    const datos = JSON.parse(recordado);
                    if (datos && datos.usuario) {
                        document.getElementById('usuario').value = datos.usuario;
                        if (datos.password) document.getElementById('password').value = datos.password;
                        document.getElementById('recordar').checked = true;
                    }
                }
            } catch (e) { }
        })();

        let enviandoLogin = false;
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (enviandoLogin) return;
            const btn = document.getElementById('btnIngresar');
            const usuario = document.getElementById('usuario').value.trim();
            const password = document.getElementById('password').value.trim();
            const recordar = document.getElementById('recordar').checked;
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = '';

            const recordarClave = () => {
                try {
                    if (recordar) {
                        localStorage.setItem('login_recordado', JSON.stringify({ usuario, password }));
                    } else {
                        localStorage.removeItem('login_recordado');
                    }
                } catch (e) { }
            };

            enviandoLogin = true;
            btn.disabled = true;
            btn.textContent = 'Ingresando...';
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    recordarClave();
                    localStorage.setItem('usuario_actual', data.usuario);
                    localStorage.setItem('rol_actual', data.rol);
                    localStorage.setItem('token_actual', data.token);

                    switch (String(data.rol || '').trim()) {
                        case 'auditoria':
                            window.location.href = 'auditoria.html';
                            break;
                        case 'vigilancia':
                            window.location.href = 'vigilancia.html';
                            break;
                        case 'almacen':
                            window.location.href = 'almacen.html';
                            break;
                        case 'soplado':
                            window.location.href = 'soplado.html';
                            break;
                        case 'envasado':
                            window.location.href = 'envasado.html';
                            break;
                        case 'produccion':
                        case 'supervisor':
                        case 'invitado':
                            window.location.href = 'dashboard.html';
                            break;
                        case 'refinado':
                            window.location.href = 'refinado.html';
                            break;
                        case 'admin':
                            window.location.href = 'admin.html';
                            break;
                        default:
                            window.location.href = 'dashboard.html';
                    }
                } else {
                    errorDiv.textContent = data.mensaje || 'Usuario o contraseña incorrectos.';
                }
            } catch (err) {
                console.error(err);
                errorDiv.textContent = 'Error de conexión con el servidor.';
            } finally {
                enviandoLogin = false;
                btn.disabled = false;
                btn.textContent = 'Ingresar al Sistema';
            }
        });
    </script>
</body>
</html>
