<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Vigilancia - Belcen</title>
    <link rel="stylesheet" href="/motion.css">
    <style>
        :root {
            --bg: #f2f2f7;
            --card: rgba(255, 255, 255, 0.72);
            --card-bord: rgba(0, 0, 0, 0.07);
            --texto: #1c1c1e;
            --texto2: #6c7280;
            --azul: #0a84ff;
            --verde: #34c759;
            --rojo: #ff3b30;
            --ambar: #ff9500;
            --sombra: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            background-color: var(--bg);
            color: var(--texto);
            padding: 24px 16px 56px;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            max-width: 900px; margin: auto;
            background: var(--card);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid var(--card-bord);
            border-radius: 20px;
            box-shadow: var(--sombra);
            padding: 25px;
            border-top: 5px solid var(--ambar);
            margin-bottom: 25px;
        }
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .card { background: rgba(255, 255, 255, 0.94); }
        }

        h3 {
            color: #a05a00;
            text-align: center;
            border-bottom: 2px solid rgba(255, 149, 0, 0.35);
            padding: 0 0 12px;
            margin: 0 0 18px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        select, input {
            padding: 12px 14px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            font-size: 14px;
            box-sizing: border-box;
            width: 100%;
            margin-top: 6px;
            background: rgba(255, 255, 255, 0.7);
            color: var(--texto);
            font-family: inherit;
        }
        select:focus, input:focus {
            outline: none;
            border-color: var(--azul);
            box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.15);
        }
        select { -webkit-appearance: none; appearance: none; background-image: linear-gradient(45deg, transparent 50%, #6c7280 50%), linear-gradient(135deg, #6c7280 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }

        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .span-2 { grid-column: 1 / -1; }

        .tabla-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 14px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 14px; border: 1px solid rgba(0, 0, 0, 0.07); border-radius: 14px; overflow: hidden; background: rgba(255, 255, 255, 0.6); }
        th, td { padding: 11px 12px; text-align: left; font-size: 13px; }
        th { background: #f5f5f7; color: var(--texto2); font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; border-bottom: 1px solid rgba(0, 0, 0, 0.06); white-space: nowrap; }
        td { border-bottom: 1px solid rgba(0, 0, 0, 0.04); }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: rgba(0, 0, 0, 0.02); }
        .text-center { text-align: center; }
        .sin-registros { color: var(--texto2); font-style: italic; }
        .celda-diff { color: var(--rojo); font-weight: 700; }
        .btn-x {
            background: var(--rojo); color: white; border: none; padding: 6px 12px;
            border-radius: 999px; cursor: pointer; font-weight: 700; font-family: inherit;
            min-width: 32px;
        }

        .logout { display: inline-block; margin-bottom: 12px; color: var(--azul); text-decoration: none; font-weight: 600; }
        .logout:hover { text-decoration: underline; }

        .btn-accion {
            background: var(--verde);
            color: white;
            border: none;
            padding: 14px 20px;
            font-weight: 700;
            border-radius: 999px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-family: inherit;
            box-shadow: 0 6px 16px rgba(52, 199, 89, 0.30);
            margin-top: 16px;
        }
        .btn-accion:hover { filter: brightness(0.96); }
        .btn-accion:active { transform: scale(0.98); }
        .btn-accion:disabled { opacity: 0.6; }

        .carga-box {
            margin-top: 20px;
            background: rgba(255, 149, 0, 0.09);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 149, 0, 0.28);
        }
        .carga-box h4 { margin: 0 0 12px; color: #a05a00; font-size: 15px; }
        .fila-carga { display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-end; flex-wrap: wrap; }
        .fila-carga > div { flex: 1 1 140px; }
        .fila-carga .g2 { flex: 2 1 220px; }
        .fila-carga .g1 { flex: 1 1 120px; }
        .fila-carga label { font-size: 12px; color: var(--texto2); }
        .btn-add-vig {
            background: var(--ambar); color: #fff; border: none; padding: 11px 16px; font-weight: 700;
            border-radius: 999px; cursor: pointer; font-family: inherit; white-space: nowrap;
            box-shadow: 0 4px 12px rgba(255, 149, 0, 0.28);
        }
        .btn-add-vig:active { transform: scale(0.97); }

        .btn-logout-custom {
            background: var(--rojo); color: white; border: none; padding: 12px 22px; font-weight: 700;
            border-radius: 999px; cursor: pointer; font-size: 14px; font-family: inherit;
            box-shadow: 0 6px 16px rgba(255, 59, 48, 0.25);
        }
        .btn-logout-custom:hover { filter: brightness(0.95); }
        .btn-logout-custom:active { transform: scale(0.97); }

        .pie-foot {
            text-align: center;
            margin-top: 26px;
            padding-top: 16px;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
        }

        @media (max-width: 640px) {
            body { padding: 12px 10px calc(16px + env(safe-area-inset-bottom)); }
            .card { padding: 18px; }
            h3 { font-size: 18px; }
            select, input { font-size: 16px; }
            .grid-form { grid-template-columns: 1fr; }
            table { min-width: 520px; }
            th, td { padding: 9px 10px; }
            .fila-carga > div { flex: 1 1 45%; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <div class="card reveal">
        <h3>REGISTRO DE INGRESO - VIGILANCIA</h3>
        
        <form id="formVigilancia" enctype="multipart/form-data">
            <div class="grid-form">
                <div>
                    <label><b>Tipo de Documento:</b></label>
                    <select id="tipo_documento" name="tipo_documento">
                        <option value="GUIA DE REMISION">Guía de Remisión</option>
                        <option value="FACTURA">Factura</option>
                        <option value="OTRO">Otro Documento</option>
                    </select>
                </div>
                <div>
                    <label><b>N° de Guía / Documento:</b></label>
                    <input type="text" id="numero_guia" name="numero_guia" placeholder="Ej. T001-000452" required>
                </div>
                <div>
                    <label><b>Empresa Proveedora:</b></label>
                    <input type="text" id="proveedor" name="proveedor" placeholder="Razón Social del Proveedor" required>
                </div>
                <div>
                    <label><b>Nombre del Conductor:</b></label>
                    <input type="text" id="chofer" name="chofer" placeholder="Apellidos y nombres del chofer">
                </div>
                <div>
                    <label><b>Documento de Identidad (DNI):</b></label>
                    <input type="text" id="dni_chofer" name="dni_chofer" placeholder="N° de DNI / Pasaporte">
                </div>
                <div>
                    <label><b>Placa del Vehículo:</b></label>
                    <input type="text" id="placa" name="placa" placeholder="Ej. ABC-123">
                </div>
                <div>
                    <label><b>Lugar de Partida / Destino:</b></label>
                    <input type="text" id="lugar_partida" name="lugar_partida" placeholder="Origen -> Planta Principal Belcen">
                </div>
                <div>
                    <label><b>Foto de Guía / Evidencia:</b></label>
                    <input type="file" id="foto_guia" name="foto_guia" accept="image/*">
                </div>
                <div class="span-2">
                    <label><b>Observaciones Especiales (Estado de carga / Precintos / EPP):</b></label>
                    <input type="text" id="observaciones" name="observaciones" placeholder="Ej. Precinto OK, chofer con EPP completo (casco, botas)">
                </div>
            </div>

            <div class="carga-box">
                <h4>📦 Datos de la Carga e Insumos</h4>
                
                <div class="fila-carga">
                    <div class="g2">
                        <label><b>Descripción del Insumo / Producto:</b></label>
                        <input type="text" id="prod_textual" placeholder="Ej. Botella Belini x 1 Lt / Cajas / Tapas">
                    </div>
                    <div class="g1">
                        <label><b>Cantidad Guía:</b></label>
                        <input type="number" step="0.01" id="prod_cant_guia" placeholder="Cant. Papel">
                    </div>
                    <div class="g1">
                        <label><b>Cantidad Física:</b></label>
                        <input type="number" step="0.01" id="prod_cant_fisica" placeholder="Cant. Real">
                    </div>
                    <div>
                        <button type="button" onclick="agregarItemVigilancia()" class="btn-add-vig">+ Añadir</button>
                    </div>
                </div>

                <div class="tabla-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>PRODUCTO / INSUMO</th>
                                <th class="text-center">CANT. GUÍA</th>
                                <th class="text-center">CANT. FÍSICA</th>
                                <th class="text-center">QUITAR</th>
                            </tr>
                        </thead>
                        <tbody id="tablaItemsVigilancia">
                            <tr><td colspan="4" class="text-center sin-registros">No hay productos agregados.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div>
                <button type="submit" class="btn-accion">🚀 REGISTRAR INGRESO Y ENVIAR NOTIFICACIÓN A ALMACÉN</button>
            </div>
        </form>

        <div class="pie-foot">
            <a href="dashboard.html" class="logout" id="linkDashboard">Volver al Dashboard General</a>
            <br>
            <button onclick="cerrarSesion()" class="btn-logout-custom">🔒 Cerrar Sesión (Salir)</button>
        </div>
    </div>

    <script src="/motion.js" defer></script>
    <script src="/auth-client.js"></script>
    <script>
        // Control estricto de roles
        const rolUsuario = localStorage.getItem('rol_actual');
        if (!rolUsuario || (rolUsuario !== 'vigilancia' && rolUsuario !== 'supervisor' && rolUsuario !== 'produccion')) {
            alert('❌ Acceso no autorizado.');
            window.location.href = 'index.html';
        }
        if (rolUsuario !== 'supervisor' && rolUsuario !== 'produccion') {
            document.getElementById('linkDashboard').style.display = 'none'; // Solo roles con permiso de dashboard
        }

        let itemsVigilanciaArray = [];

        function cerrarSesion() {
            if (confirm('¿Estás seguro de que deseas cerrar sesión?')) {
                limpiarSesion();
                window.location.href = 'index.html';
            }
        }

        function agregarItemVigilancia() {
            const nombre = document.getElementById('prod_textual').value.trim();
            const cantidad_guia = parseFloat(document.getElementById('prod_cant_guia').value);
            const cantidad_fisica = parseFloat(document.getElementById('prod_cant_fisica').value);

            if (!nombre || isNaN(cantidad_guia) || isNaN(cantidad_fisica)) {
                alert('❌ Complete la descripción y las cantidades (guía y física).');
                return;
            }

            itemsVigilanciaArray.push({ nombre, cantidad_guia, cantidad_fisica });
            renderTablaVigilancia();

            document.getElementById('prod_textual').value = '';
            document.getElementById('prod_cant_guia').value = '';
            document.getElementById('prod_cant_fisica').value = '';
        }

        function quitarItemVigilancia(index) {
            itemsVigilanciaArray.splice(index, 1);
            renderTablaVigilancia();
        }

        function renderTablaVigilancia() {
            const tbody = document.getElementById('tablaItemsVigilancia');
            if (itemsVigilanciaArray.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center sin-registros">No hay productos agregados.</td></tr>`;
                return;
            }
            tbody.innerHTML = '';
            itemsVigilanciaArray.forEach((item, idx) => {
                const diffColor = item.cantidad_guia !== item.cantidad_fisica ? 'celda-diff' : '';
                tbody.innerHTML += `
                    <tr>
                        <td><b>${item.nombre}</b></td>
                        <td class="text-center">${item.cantidad_guia}</td>
                        <td class="text-center ${diffColor}">${item.cantidad_fisica}</td>
                        <td class="text-center"><button type="button" onclick="quitarItemVigilancia(${idx})" class="btn-x">X</button></td>
                    </tr>
                `;
            });
        }

        let enviandoVigilancia = false;
        document.getElementById('formVigilancia').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (enviandoVigilancia) return;
            enviandoVigilancia = true;
            const btnEnviar = e.submitter || document.querySelector('#formVigilancia button[type="submit"]');
            if (btnEnviar) btnEnviar.disabled = true;
            if (itemsVigilanciaArray.length === 0) {
                alert('❌ Debe agregar al menos un producto o insumo a la guía.');
                enviandoVigilancia = false;
                if (btnEnviar) btnEnviar.disabled = false;
                return;
            }

            const formData = new FormData(e.target);
            formData.append('usuario', localStorage.getItem('usuario_actual') || 'vigilancia1');
            formData.append('items_json', JSON.stringify(itemsVigilanciaArray));

            try {
                const res = await fetch('/api/vigilancia/registrar', { method: 'POST', body: formData });
                const data = await res.json();
                if (res.ok && data.success) {
                    alert('✅ ' + data.mensaje);
                    document.getElementById('formVigilancia').reset();
                    itemsVigilanciaArray = [];
                    renderTablaVigilancia();
                } else {
                    alert('❌ ' + (data.mensaje || 'Error al registrar.'));
                }
            } catch (err) {
                console.error(err);
                alert('Error de conexión con el servidor.');
            } finally {
                enviandoVigilancia = false;
                if (btnEnviar) btnEnviar.disabled = false;
            }
        });
    </script>
</body>
</html>
