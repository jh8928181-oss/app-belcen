<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría - Corporación Belcen</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #343a40; text-align: center; border-bottom: 2px solid #343a40; padding-bottom: 8px; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #dee2e6; padding: 10px; text-align: left; font-size: 13px; }
        th { background-color: #343a40; color: white; }
        .logout { background-color: #dc3545; border: none; padding: 10px 20px; text-decoration: none; color: white; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .logout:hover { background-color: #c82333; }
        .text-center { text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Panel de Auditoría - Registros de Vigilancia y Almacén</h2>
        <table>
            <thead>
                <tr>
                    <th>Fecha / Hora</th>
                    <th>Vigilante</th>
                    <th>Documento / N°</th>
                    <th>Productos (Guía vs Físico)</th>
                    <th>Proveedor / Ruta</th>
                    <th>Estado / Conformidad</th>
                    <th class="text-center">Evidencia</th>
                </tr>
            </thead>
            <tbody id="tablaAuditoria">
                <tr><td colspan="7" class="text-center">Cargando registros de auditoría...</td></tr>
            </tbody>
        </table>

        <div style="text-align: center; margin-top: 25px; padding-top: 15px; border-top: 1px solid #ddd;">
            <a href="dashboard.html" style="display: inline-block; margin-bottom: 10px; color: #007bff; text-decoration: none; font-weight: bold;">Volver al Dashboard General</a>
            <br>
            <button class="logout" onclick="cerrarSesion()">🔒 Cerrar Sesión (Salir)</button>
        </div>
    </div>

    <script>
        function cerrarSesion() {
            if (confirm('¿Estás seguro de que deseas cerrar sesión?')) {
                localStorage.removeItem('usuario_actual');
                localStorage.removeItem('rol_usuario');
                window.location.href = 'index.html';
            }
        }

        async function cargarRegistrosAuditoria() {
            try {
                const res = await fetch('/api/auditoria/registros');
                const registros = await res.json();
                const tbody = document.getElementById('tablaAuditoria');
                tbody.innerHTML = '';

                if(registros.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center">No hay registros en el sistema.</td></tr>';
                    return;
                }

                registros.forEach(item => {
                    let fotoHtml = item.foto_url ? `<a href="${item.foto_url}" target="_blank">Ver Foto</a>` : 'Sin Foto';
                    
                    // Soporte para múltiples productos en JSON o texto antiguo
                    let productosHtml = '';
                    try {
                        const parsed = JSON.parse(item.items_json || '[]');
                        if (parsed.length > 0) {
                            parsed.forEach(p => {
                                let diff = p.cantidad_guia !== p.cantidad_fisica 
                                    ? `<span style="color:red; font-weight:bold;">(Guía: ${p.cantidad_guia} | Físico: ${p.cantidad_fisica})</span>` 
                                    : `(Cant: ${p.cantidad_fisica})`;
                                productosHtml += `<div>• <b>${p.nombre}</b> ${diff}</div>`;
                            });
                        } else {
                            productosHtml = `${item.producto_textual || 'N/D'}<br><b>Cant:</b> ${item.cantidad || 0}`;
                        }
                    } catch(e) {
                        productosHtml = `${item.producto_textual || 'N/D'}<br><b>Cant:</b> ${item.cantidad || 0}`;
                    }

                    const fechaFormateada = item.fecha_registro ? item.fecha_registro.replace('T', ' ').substring(0, 19) : 'N/D';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${fechaFormateada}</td>
                        <td>${item.usuario_vigilancia || 'N/D'}</td>
                        <td><b>${item.tipo_documento}</b><br>${item.numero_guia || 'S/N'}</td>
                        <td>${productosHtml}</td>
                        <td>${item.proveedor || '-'}<br><small>${item.lugar_partida || ''} -> ${item.punto_llegada || ''}</small></td>
                        <td><span style="color: ${item.estado && item.estado.includes('CONFORME') ? 'green' : 'orange'}; font-weight:bold;">${item.estado || 'PENDIENTE'}</span></td>
                        <td class="text-center">${fotoHtml}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch(err) {
                console.error(err);
                document.getElementById('tablaAuditoria').innerHTML = '<tr><td colspan="7" class="text-center" style="color:red;">Error al cargar los registros de auditoría.</td></tr>';
            }
        }

        cargarRegistrosAuditoria();
    </script>
</body>
</html>
