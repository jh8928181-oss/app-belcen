<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Envasado - Belcen</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f4f6f9; padding: 20px; }
        .card { max-width: 1000px; margin: auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 25px; }
        h3 { color: #343a40; text-align: center; border-bottom: 2px solid #007bff; padding-bottom: 8px; margin-top: 0; }
        select, input, textarea { padding: 8px; border: 1px solid #ced4da; border-radius: 4px; font-size: 14px; box-sizing: border-box; width: 100%; margin-top: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #007bff; color: white; }
        .text-center { text-align: center; }
        .logout { display: inline-block; margin-bottom: 10px; color: #dc3545; text-decoration: none; font-weight: bold; }
        .btn-accion { padding: 8px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; margin-top: 15px; }
        .btn-accion:hover { background: #218838; }
        .btn-volver { background: #6c757d; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; margin-bottom: 15px; }
        .btn-volver:hover { background: #5a6268; }
        .opcion-menu { flex: 1 1 260px; max-width: 300px; padding: 28px 20px; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 17px; font-weight: bold; box-shadow: 0 4px 8px rgba(0,0,0,0.15); }
        .opcion-menu:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.2); }
        .opcion-menu small { font-weight: normal; font-size: 13px; display: block; margin-top: 8px; }
        .btn-logout-custom { background: #dc3545; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn-logout-custom:hover { background: #c82333; }
    </style>
</head>
<body>
    <div style="max-width: 1000px; margin: auto;">

        <!-- MENÚ PRINCIPAL -->
        <div id="menuEnvasado" class="card" style="border-top: 5px solid #6f42c1; text-align: center;">
            <h3 style="color: #6f42c1; border-bottom: 2px solid #6f42c1;">ENVASADO - MENÚ PRINCIPAL</h3>
            <p style="color: #555; margin-top: 10px;">Selecciona una opción para continuar:</p>
            <div style="display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-top: 25px;">
                <button onclick="mostrarVista('reportar')" class="opcion-menu" style="background: #28a745;">🖊️ REPORTAR PRODUCCIÓN<small>Registrar un nuevo reporte de producción</small></button>
                <button onclick="mostrarVista('activa')" class="opcion-menu" style="background: #007bff;">📊 VER PRODUCCIÓN EN CURSO<small>Producción activa del día en curso</small></button>
            </div>
        </div>

        <!-- VISTA 1: REGISTRO DE PRODUCCIÓN -->
        <div id="vistaReportar" class="card" style="border-top: 5px solid #28a745; display: none;">
            <div style="text-align: left;">
                <button onclick="mostrarMenu()" class="btn-volver">← Volver al menú</button>
            </div>
            <h3 style="color: #28a745; border-bottom: 2px solid #28a745;">REGISTRO DE PRODUCCIÓN - LÍNEA DE ENVASADO</h3>

            <form id="formEnvasado" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;">
            <div>
                <label><b>Fecha de Producción:</b></label>
                <input type="date" id="fecha_produccion" name="fecha_produccion" required>
            </div>

            <div>
                <label><b>Presentación / Producto:</b></label>
                <select id="presentacion" name="presentacion" onchange="verificarSeleccionTapa()" required>
                    <option value="">-- Seleccionar Presentación --</option>
                    <option value="Aceite de Soya B-1 200 ml">Aceite de Soya B-1 200 ml (Cajas x 24)</option>
                    <option value="Aceite de Soya B-1 500 ml">Aceite de Soya B-1 500 ml (Cajas x 12)</option>
                    <option value="Aceite de Soya B-1 900 ml">Aceite de Soya B-1 900 ml (Cajas x 12)</option>
                    <option value="Aceite de Soya B-1 1 Lt">Aceite de Soya B-1 1 Lt (Cajas x 12)</option>
                    <option value="Aceite de Soya B-1 2 Lt">Aceite de Soya B-1 2 Lt (Cajas x 6)</option>
                    <option value="Aceite de Soya B-1 5 Lt (Galonera)">Aceite de Soya B-1 5 Lt (Galonera x 4)</option>
                    <option value="Aceite de Soya Don Lalo 800 ml">Aceite de Soya Don Lalo 800 ml (Cajas x 12)</option>
                    <option value="Aceite de Soya Don Lalo Balde 20 Lt">Aceite de Soya Don Lalo Balde 20 Lt</option>
                    <option value="Aceite de Soya Belini 200 ml">Aceite de Soya Belini 200 ml (Cajas x 24)</option>
                    <option value="Aceite de Soya Belini 500 ml">Aceite de Soya Belini 500 ml (Cajas x 12)</option>
                    <option value="Aceite de Soya Belini 900 ml">Aceite de Soya Belini 900 ml (Cajas x 12)</option>
                    <option value="Aceite de Soya Belini 1 Lt">Aceite de Soya Belini 1 Lt (Cajas x 12)</option>
                    <option value="Aceite de Soya Belini 2 Lt (Galonera)">Aceite de Soya Belini 2 Lt (Galonera x 6)</option>
                    <option value="Aceite de Soya Belini 3 Lt">Aceite de Soya Belini 3 Lt (Cajas x 4)</option>
                    <option value="Aceite de Soya Belini 5 Lt (Galonera)">Aceite de Soya Belini 5 Lt (Galonera x 4)</option>
                    <option value="Aceite de Soya Belini Lata 18 Lt">Aceite de Soya Belini Lata 18 Lt</option>
                    <option value="Aceite de Soya Belini Balde 18 Lt">Aceite de Soya Belini Balde 18 Lt</option>
                </select>
            </div>

            <div>
                <label><b>Cantidad Producida (Cajas):</b></label>
                <input type="number" id="cantidad_cajas" name="cantidad_cajas" min="1" placeholder="Ej. 100" required>
            </div>

            <div>
                <label><b>Toneladas (TM):</b></label>
                <input type="number" step="0.01" id="toneladas" name="toneladas" placeholder="Ej. 1.5" required>
            </div>

            <div id="grupoTapaDinamica" style="display: none; grid-column: span 2; background: #e9ecef; padding: 12px; border-radius: 6px; border: 1px solid #ced4da;">
                <label style="color: #495057;"><b>⚙️ Tapa Utilizada para este Producto:</b></label>
                <select id="tapa_elegida" name="tapa_elegida">
                    <option value="Tapa dosif. N° 26 blanco / Dorado">Tapa dosif. N° 26 blanco / Dorado</option>
                    <option value="Tapa Dosif. N° 26 blanco / Celeste">Tapa Dosif. N° 26 blanco / Celeste</option>
                    <option value="Tapa dosif. N° 28 blanco / Dorado">Tapa dosif. N° 28 blanco / Dorado</option>
                    <option value="Tapa Dosf. N° 28 / Celeste">Tapa Dosf. N° 28 / Celeste</option>
                    <option value="Asas plasticas /Dorado (2LT)">Asas plasticas /Dorado (2LT)</option>
                    <option value="Tapones Verdes">Tapones Verdes</option>
                    <option value="Tapa Tapon 26mm (200ml)">Tapa Tapón 26mm (200ml)</option>
                    <option value="Tapa color Rojo 2lt">Tapa color Rojo 2lt</option>
                    <option value="Tapa color rojo 5lt">Tapa color rojo 5lt</option>
                    <option value="Tapa color Celeste 3lt">Tapa color Celeste 3lt</option>
                    <option value="Asas plasticas color celeste pico 45">Asas plasticas color celeste pico 45</option>
                    <option value="Tapa BALDE BELINI color amarillo">Tapa BALDE BELINI color amarillo</option>
                    <option value="TAAAAPA BALDE DON LALO">Tapa BALDE DON LALO</option>
                </select>
            </div>

            <div style="grid-column: span 2;">
                <label><b>Observaciones (N° de Lote / Detalles adicionales):</b></label>
                <textarea id="observaciones" name="observaciones" rows="2" placeholder="Ej. Lote: 0885 | Observaciones de línea..."></textarea>
            </div>

            <div style="grid-column: span 2;">
                <button type="submit" class="btn-accion">💾 REGISTRAR PRODUCCIÓN EN CURSO</button>
            </div>
            </form>
        </div>

        <!-- VISTA 2: PRODUCCIÓN ACTIVA -->
        <div id="vistaActiva" class="card" style="border-top: 5px solid #007bff; display: none;">
            <div style="text-align: left;">
                <button onclick="mostrarMenu()" class="btn-volver">← Volver al menú</button>
            </div>
            <h3 style="color: #007bff; border-bottom: 2px solid #007bff;">PRODUCCIÓN ACTIVA (DÍA EN CURSO)</h3>
        <table>
            <thead>
                <tr>
                    <th>FECHA</th>
                    <th>PRESENTACIÓN</th>
                    <th class="text-center">CANT</th>
                    <th class="text-center">UM</th>
                    <th class="text-center">TN</th>
                    <th>OBS</th>
                    <th class="text-center">ACCIONES</th>
                </tr>
            </thead>
            <tbody id="tablaProduccionActiva">
                <tr><td colspan="7" class="text-center">Cargando producción...</td></tr>
            </tbody>
        </table>
        
        <div style="display: flex; justify-content: flex-end; align-items: center; margin-top: 15px; background: #fafafa; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
            <span style="font-weight: bold; margin-right: 15px;">TOTAL TM ACUMULADO:</span>
            <span id="totalTmActivo" style="background: #ffeb3b; padding: 6px 14px; font-weight: bold; border-radius: 4px; border: 1px solid #fbc02d;">0.00</span>
        </div>

        </div>

        <!-- PIE COMÚN -->
        <div style="text-align: center; margin-top: 10px; padding: 15px; border-top: 1px solid #ddd;">
            <a href="dashboard.html" class="logout" id="linkDashboard">Volver al Dashboard General</a>
            <br>
            <button onclick="cerrarSesion()" class="btn-logout-custom">🔒 Cerrar Sesión (Salir)</button>
        </div>
    </div>

    <script src="/auth-client.js"></script>
    <script>
        const rolUsuario = localStorage.getItem('rol_actual');
        if (!rolUsuario || (rolUsuario !== 'envasado' && rolUsuario !== 'supervisor' && rolUsuario !== 'produccion')) {
            alert('❌ Acceso no autorizado.');
            window.location.href = 'index.html';
        }
        if (rolUsuario !== 'supervisor' && rolUsuario !== 'produccion') {
            document.getElementById('linkDashboard').style.display = 'none';
        }

        document.getElementById('fecha_produccion').valueAsDate = new Date();
        let reportesGlobal = [];

        function cerrarSesion() {
            if (confirm('¿Estás seguro de que deseas cerrar sesión?')) {
                limpiarSesion();
                window.location.href = 'index.html';
            }
        }

        function mostrarMenu() {
            document.getElementById('menuEnvasado').style.display = 'block';
            document.getElementById('vistaReportar').style.display = 'none';
            document.getElementById('vistaActiva').style.display = 'none';
            cargarProduccionActiva();
        }

        function mostrarVista(vista) {
            document.getElementById('menuEnvasado').style.display = 'none';
            document.getElementById('vistaReportar').style.display = vista === 'reportar' ? 'block' : 'none';
            document.getElementById('vistaActiva').style.display = vista === 'activa' ? 'block' : 'none';
            if (vista === 'activa') cargarProduccionActiva();
        }

        function verificarSeleccionTapa() {
            const presentacion = document.getElementById('presentacion').value;
            const grupoTapa = document.getElementById('grupoTapaDinamica');

            const requiereTapa = presentacion.includes('500 ml') || 
                                 presentacion.includes('900 ml') || 
                                 presentacion.includes('1 Lt') || 
                                 presentacion.includes('800 ml') || 
                                 presentacion.includes('3 Lt');

            if (requiereTapa) {
                grupoTapa.style.display = 'block';
            } else {
                grupoTapa.style.display = 'none';
            }
        }

        function fechaLocalISO(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d.getTime())) return String(iso).substring(0, 10);
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        async function cargarProduccionActiva() {
            try {
                const res = await fetch('/api/produccion/reportes');
                if (!res.ok) throw new Error('Error del servidor al cargar producción.');
                const datos = await res.json();
                reportesGlobal = Array.isArray(datos) ? datos : [];
                const tbody = document.getElementById('tablaProduccionActiva');
                
                if (reportesGlobal.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="text-center">No hay registros activos para el día en curso.</td></tr>`;
                    document.getElementById('totalTmActivo').textContent = '0.00';
                    return;
                }

                tbody.innerHTML = '';
                let sumaTn = 0;
                reportesGlobal.forEach(row => {
                    const fechaStr = row.fecha_produccion ? fechaLocalISO(row.fecha_produccion) : '';
                    sumaTn += parseFloat(row.toneladas || 0);
                    const presentacionSegura = String(row.presentacion || '').replace(/'/g, "\\'");
                    tbody.innerHTML += `
                        <tr>
                            <td>${fechaStr}</td>
                            <td><b>${row.presentacion}</b></td>
                            <td class="text-center">${row.cantidad_cajas}</td>
                            <td class="text-center">${row.unidad_medida || 'CAJAS'}</td>
                            <td class="text-center">${row.toneladas}</td>
                            <td>${row.observaciones || '-'}</td>
                            <td class="text-center"><button onclick="eliminarReporte(${row.id}, '${presentacionSegura}')" style="background:#dc3545; color:white; border:none; padding:4px 10px; border-radius:4px; cursor:pointer; font-size:12px;">🗑️ Eliminar</button></td>
                        </tr>
                    `;
                });
                document.getElementById('totalTmActivo').textContent = sumaTn.toFixed(2);
            } catch (e) {
                console.error(e);
            }
        }

        let enviandoEnvasado = false;
        document.getElementById('formEnvasado').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (enviandoEnvasado) return;
            enviandoEnvasado = true;
            const btnEnviar = e.submitter || document.querySelector('#formEnvasado button[type="submit"]');
            if (btnEnviar) btnEnviar.disabled = true;

            const presentacionSeleccionada = document.getElementById('presentacion').value;
            const observacionesTexto = document.getElementById('observaciones').value;
            const grupoTapaVisible = document.getElementById('grupoTapaDinamica').style.display === 'block';

            let observacionesFinales = observacionesTexto;
            if (grupoTapaVisible) {
                const tapaSeleccionada = document.getElementById('tapa_elegida').value;
                observacionesFinales = observacionesFinales ? `${observacionesFinales} | Tapa: ${tapaSeleccionada}` : `Tapa: ${tapaSeleccionada}`;
            }

            const formData = {
                fecha_produccion: document.getElementById('fecha_produccion').value,
                presentacion: presentacionSeleccionada,
                cantidad_cajas: parseInt(document.getElementById('cantidad_cajas').value),
                toneladas: parseFloat(document.getElementById('toneladas').value),
                observaciones: observacionesFinales,
                usuario: localStorage.getItem('usuario_actual') || 'envasado_user'
            };

            try {
                const res = await fetch('/api/produccion/reporte', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    alert('✅ Producción registrada correctamente.');
                    document.getElementById('formEnvasado').reset();
                    document.getElementById('fecha_produccion').valueAsDate = new Date();
                    document.getElementById('grupoTapaDinamica').style.display = 'none';
                    cargarProduccionActiva();
                } else {
                    alert('❌ ' + (data.mensaje || 'Error al registrar.'));
                }
            } catch (err) {
                console.error(err);
                alert('Error de conexión con el servidor.');
            } finally {
                enviandoEnvasado = false;
                if (btnEnviar) btnEnviar.disabled = false;
            }
        });

        async function eliminarReporte(id, presentacion) {
            if (!confirm(`¿Eliminar el reporte de "${presentacion}"?\n\nSe devolverán los insumos al inventario y se quitarán las cajas de producto terminado. Podrás volver a reportarlo.`)) return;
            try {
                const res = await fetch('/api/produccion/eliminar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reporte_id: id })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    alert('✅ ' + data.mensaje);
                    cargarProduccionActiva();
                } else {
                    alert('❌ ' + (data.mensaje || 'Error al eliminar el reporte.'));
                }
            } catch (err) {
                console.error(err);
                alert('Error de conexión con el servidor.');
            }
        }

        cargarProduccionActiva();
    </script>
</body>
</html>
