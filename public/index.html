<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso ERP - Corporación Belcen</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 380px; box-sizing: border-box; }
        h2 { text-align: center; color: #343a40; margin-bottom: 25px; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #495057; font-size: 14px; }
        input { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        .error-msg { color: #dc3545; text-align: center; margin-top: 15px; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Corporación Belcen S.A.C.</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" placeholder="Ingrese su usuario" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="Ingrese su contraseña" required>
            </div>
            <button type="submit">Ingresar al Sistema</button>
        </form>
        <div id="errorMsg" class="error-msg"></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = '';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Guardar sesión básica en localStorage
                    localStorage.setItem('usuario_actual', data.usuario);
                    localStorage.setItem('rol_actual', data.rol);

                    // Redirección estricta según el rol del usuario
                    switch (data.rol) {
                        case 'auditoria':
        window.location.href = 'auditoria.html';
        break;
                        case 'vigilancia':
                            window.location.href = 'vigilancia.html';
                            break;
                        case 'almacen':
                            window.location.href = 'almacen.html';
                            break;
                        case 'soplado':
                            window.location.href = 'soplado.html';
                            break;
                        case 'envasado':
                            window.location.href = 'envasado.html';
                            break;
                        default:
                            errorDiv.textContent = 'Rol no autorizado en el sistema.';
                    }
                } else {
                    errorDiv.textContent = data.mensaje || 'Usuario o contraseña incorrectos.';
                }
            } catch (err) {
                console.error(err);
                errorDiv.textContent = 'Error de conexión con el servidor.';
            }
        });
    </script>
</body>
</html>
